name: update-upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-upstream
  cancel-in-progress: false

jobs:
  searxng:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read current version
        id: current
        run: |
          version="$(sed -n 's/^ARG SEARXNG_VERSION=//p' Dockerfile)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9a-f]{6,40})?$'; then
            echo "Unexpected SEARXNG_VERSION: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Find latest upstream image
        id: upstream
        run: |
          version="$(curl -fsS --retry 3 --max-time 30 \
            'https://hub.docker.com/v2/repositories/searxng/searxng/tags?page_size=25&ordering=last_updated' \
            | jq -r '[.results[].name | select(test("^[0-9]{4}\\.[0-9]{1,2}\\.[0-9]{1,2}(-[0-9a-f]{6,40})?$"))] | first // empty')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9a-f]{6,40})?$'; then
            echo "Could not determine the latest SearXNG image tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update Dockerfile pin
        if: steps.upstream.outputs.version != steps.current.outputs.version
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          sed -i -E "s|^ARG SEARXNG_VERSION=.*|ARG SEARXNG_VERSION=${VERSION}|" Dockerfile
          grep -qxF "ARG SEARXNG_VERSION=${VERSION}" Dockerfile

      - name: Build comparison link
        id: compare
        if: steps.upstream.outputs.version != steps.current.outputs.version
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.upstream.outputs.version }}
        run: |
          old_sha="${CURRENT##*-}"
          new_sha="${LATEST##*-}"
          url=""
          if [ "$old_sha" != "$CURRENT" ] && [ "$new_sha" != "$LATEST" ]; then
            url="https://github.com/searxng/searxng/compare/${old_sha}...${new_sha}"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        if: steps.upstream.outputs.version != steps.current.outputs.version
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: update/searxng
          commit-message: "Bump SearXNG to ${{ steps.upstream.outputs.version }}"
          title: "Bump SearXNG to ${{ steps.upstream.outputs.version }}"
          body: |
            Updates SearXNG from `${{ steps.current.outputs.version }}` to `${{ steps.upstream.outputs.version }}`.

            Upstream changes: ${{ steps.compare.outputs.url }}

            CI smoke-tests this change. Review the upstream changes before merging, then publish a wrapper patch release.
          delete-branch: true

      - name: Run CI on update branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --ref "$PR_BRANCH" --repo "${{ github.repository }}"
